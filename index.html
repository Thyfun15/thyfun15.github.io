<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>갑상선 수술 안내</title>
<style>
:root{--bg:#fbf8f3;--card:#fff;--ink:#1f2328;--sub:#555b63;--line:#e6e0d6;--accent:#2f6f5e}
@media (prefers-color-scheme: dark){:root{--bg:#15181b;--card:#1e2226;--ink:#eceff1;--sub:#a9b0b7;--line:#30363c;--accent:#7cc7b0}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:19px;line-height:1.6;word-break:keep-all}
main{max-width:640px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.6rem;margin:8px 0 6px}
p.sub{color:var(--sub);margin:0 0 20px}
a.item{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:10px 0;color:var(--ink);text-decoration:none}
a.item b{color:var(--accent);margin-right:8px}
footer{margin-top:32px;color:var(--sub);font-size:.9rem}
</style>
</head>
<body>
<main>
<h1>갑상선 수술 안내</h1>

</main>
</body>
</html>
